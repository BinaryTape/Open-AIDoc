# Single-package repo; settings live here for pnpm 11+
packages:
  - '.'

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true

onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - '@google/genai'

# The lean-chunk fix (P0-10); see the comment in the patch.
patchedDependencies:
  vitepress@2.0.0-alpha.18: patches/vitepress@2.0.0-alpha.18.patch
