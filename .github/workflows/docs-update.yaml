name: Docs update

# Each upstream repository is synced and translated in its own job, all from
# the same commit of main; the jobs only upload what they changed. One final
# job applies every job's changes, commits once and pushes straight to the
# branch the workflow runs on (main), so no two jobs ever race to push. Tests
# and the site build run after the push and only report: a sync is never held
# back, and a broken result shows up in the run summary to be fixed after.
#
# A repository whose job fails is left out of the commit and keeps its
# checkpoint, so the next run syncs it again. To retry right away, use
# "Re-run failed jobs" (the final job is repeatable), or run the workflow with
# `repo` set.

on:
  schedule:
    - cron: "0 0 * * 0" # Run every Sunday at 0:00 UTC
  workflow_dispatch:
    inputs:
      repo:
        description: "Only sync these upstream repositories (REPOS ids, comma-separated); empty for all"
        required: false
        default: ""

concurrency:
  group: docs-update
  cancel-in-progress: false

# The push uses DOCS_SYNC_TOKEN (admin/maintain PAT) so the main ruleset can be
# bypassed. Commit author/committer come from DOCS_SYNC_NAME + DOCS_SYNC_EMAIL.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repos: ${{ steps.repos.outputs.repos }}
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Check sync secrets
        env:
          DOCS_SYNC_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          DOCS_SYNC_NAME: ${{ secrets.DOCS_SYNC_NAME }}
          DOCS_SYNC_EMAIL: ${{ secrets.DOCS_SYNC_EMAIL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          missing=0
          for key in DOCS_SYNC_TOKEN DOCS_SYNC_NAME DOCS_SYNC_EMAIL GOOGLE_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add these repository secrets (Settings → Secrets and variables → Actions):"
            echo "  DOCS_SYNC_TOKEN  — PAT of the sync account (repo contents: read/write; account needs Admin or Maintain to bypass main ruleset)"
            echo "  DOCS_SYNC_NAME   — git user.name / GitHub display identity (e.g. openaidoc-sync)"
            echo "  DOCS_SYNC_EMAIL  — verified email or noreply, e.g. 12345678+openaidoc-sync@users.noreply.github.com"
            echo "  GOOGLE_API_KEY   — Gemini API key used for translation"
            exit 1
          fi

      - name: Checkout main repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm

      # Every job starts from this commit, so their changes combine cleanly.
      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: List repositories to sync
        id: repos
        env:
          REPO_INPUT: ${{ inputs.repo }}
        run: node --import tsx tools/pipeline/docs-pipeline.mjs list --repo "$REPO_INPUT" >> "$GITHUB_OUTPUT"

  translate:
    name: translate (${{ matrix.repo }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      # One repository failing must not cancel the others.
      fail-fast: false
      # All jobs share the Gemini quota; each runs up to 10 requests at once.
      max-parallel: 3
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: ./.github/actions/setup-pnpm

      # Translation calls retry on their own; this retries the whole job once
      # for failures around them (a clone that times out, a crashed runner
      # step). Exit code 3 is a credentials problem, which a retry cannot fix.
      - name: Sync and translate ${{ matrix.repo }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          REPO: ${{ matrix.repo }}
        run: |
          for attempt in 1 2; do
            node --import tsx tools/pipeline/docs-pipeline.mjs translate \
              --repo "$REPO" --out "$RUNNER_TEMP/sync" && exit 0
            status=$?
            if [ "$status" -eq 3 ]; then exit "$status"; fi
            echo "::warning::Attempt $attempt for $REPO failed (exit $status)"
            # Start the retry from the base commit; upstream clones are
            # git-ignored and survive, so they are only fetched again.
            git reset -q --hard && git clean -qfd
          done
          exit 1

      - name: Upload changes
        uses: actions/upload-artifact@v4
        with:
          name: sync-${{ matrix.repo }}
          path: ${{ runner.temp }}/sync
          # Checkpoints and pending files live under .github/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: [plan, translate]
    # Commit what the successful jobs produced even when some failed.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    # Includes the report-only site build after the push.
    timeout-minutes: 120
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          token: ${{ secrets.DOCS_SYNC_TOKEN }}
          # Full history, so the sync commit can be rebased before pushing.
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      # With every job failed there is nothing to download; the next step
      # still runs and reports each repository as failed.
      - name: Download changes
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sync-*
          path: ${{ runner.temp }}/artifacts

      - name: Apply changes, translate sidebar labels and commit
        env:
          GIT_AUTHOR_NAME: ${{ secrets.DOCS_SYNC_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.DOCS_SYNC_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.DOCS_SYNC_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.DOCS_SYNC_EMAIL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EXPECTED_REPOS: ${{ needs.plan.outputs.repos }}
        run: |
          node --import tsx tools/pipeline/docs-pipeline.mjs finalize \
            --artifacts "$RUNNER_TEMP/artifacts" \
            --expect "$EXPECTED_REPOS" \
            --report "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Something may have been merged into the branch while the jobs ran: the
      # sync commit is then rebased onto it before pushing (a sync only touches
      # translated docs, sidebars, locale files and checkpoints).
      - name: Push to ${{ github.ref_name }}
        id: push
        env:
          BASE_SHA: ${{ needs.plan.outputs.sha }}
          BRANCH: ${{ github.ref_name }}
          GIT_COMMITTER_NAME: ${{ secrets.DOCS_SYNC_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.DOCS_SYNC_EMAIL }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            echo "Nothing to sync."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git -c user.name="$GIT_COMMITTER_NAME" -c user.email="$GIT_COMMITTER_EMAIL" rebase "origin/$BRANCH"
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Push attempt $attempt was rejected; retrying on the latest $BRANCH"
          done
          exit 1

      # Report only: never block the sync.
      - name: Post-sync unit tests (report only)
        id: unit_tests
        if: ${{ steps.push.outputs.pushed == 'true' }}
        continue-on-error: true
        run: pnpm test

      - name: Post-sync docs check (report only)
        id: docs_check
        if: ${{ steps.push.outputs.pushed == 'true' }}
        continue-on-error: true
        env:
          # Build as Cloudflare Pages does (4 workers); its build container has 8 GB.
          CF_PAGES: '1'
        run: |
          # GNU time records the peak resident memory of the build (in KB),
          # node included: the figure to compare with Cloudflare's limit.
          [ -x /usr/bin/time ] || sudo apt-get install -y -qq time > /dev/null || true
          measure=()
          [ -x /usr/bin/time ] && measure=(/usr/bin/time -f '%M' -o build-peak-kb.txt)
          status=0
          "${measure[@]}" pnpm docs:build || status=$?
          if [ -s build-peak-kb.txt ]; then
            echo "peak_kb=$(tail -n 1 build-peak-kb.txt)" >> "$GITHUB_OUTPUT"
          fi
          [ "$status" -eq 0 ] || exit "$status"
          pnpm docs:verify

      - name: Write post-sync test summary
        if: ${{ always() && steps.push.outputs.pushed == 'true' }}
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          DOCS_OUTCOME: ${{ steps.docs_check.outcome }}
          PEAK_KB: ${{ steps.docs_check.outputs.peak_kb }}
          # Cloudflare Pages builds in an 8 GB container; warn with 1 GB left.
          LIMIT_GB: '8'
          WARN_GB: '7'
        run: |
          memory="not measured"
          memory_high=false
          if [ -n "$PEAK_KB" ]; then
            peak_gb=$(awk -v kb="$PEAK_KB" 'BEGIN { printf "%.1f", kb / 1048576 }')
            if awk -v kb="$PEAK_KB" -v warn="$WARN_GB" 'BEGIN { exit !(kb / 1048576 >= warn) }'; then
              memory_high=true
              memory="⚠️ ${peak_gb} GB"
              echo "::warning title=Site build memory::The build peaked at ${peak_gb} GB; Cloudflare Pages builds in ${LIMIT_GB} GB."
            else
              memory="${peak_gb} GB"
            fi
          fi
          {
            echo "## Post-sync checks"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| \`pnpm test\` | ${UNIT_OUTCOME} |"
            echo "| \`pnpm docs:check\` (site build) | ${DOCS_OUTCOME} |"
            echo "| Site build peak memory (Cloudflare limit ${LIMIT_GB} GB) | ${memory} |"
            echo ""
            if [ "$UNIT_OUTCOME" != "success" ] || [ "$DOCS_OUTCOME" != "success" ]; then
              echo "⚠️ The sync is on the branch already; open the failed steps above for the logs and fix it in a follow-up change."
            elif [ "$memory_high" = true ]; then
              echo "⚠️ The checks passed, but the site build is close to Cloudflare's memory limit: the Cloudflare build may start failing. Reduce the build's memory before it does."
            else
              echo "✅ All post-sync checks passed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
